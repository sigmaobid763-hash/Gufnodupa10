services:
  ubuntu:
    image: dockurr/ubuntu
    container_name: ubuntu
    environment:
      RAM_SIZE: "4G"
      CPU_CORES: "4"
      DISK_SIZE: "20G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    stop_grace_period: 2m